version: 2

models:
  - name: dim_date
    description: Calendar / date spine dimension
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null, unique]
  - name: dim_supplier
    columns:
      - name: supplier_key
        tests: [not_null, unique]
      - name: supplier_id
        tests: [not_null, unique]
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_warehouse
    columns:
      - name: warehouse_key
        tests: [not_null, unique]
      - name: warehouse_id
        tests: [not_null, unique]
  - name: dim_carrier
    columns:
      - name: carrier_key
        tests: [not_null, unique]
      - name: carrier_id
        tests: [not_null, unique]
  - name: dim_status
    columns:
      - name: status_key
        tests: [not_null, unique]
      - name: status_domain
        tests: [not_null]
      - name: status_code
        tests: [not_null]
