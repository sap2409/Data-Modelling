version: 2

models:
  - name: stg_products
    description: Cleaned product master from seed
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests: [not_null, unique]
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: stg_warehouses
    columns:
      - name: warehouse_id
        tests: [not_null, unique]
  - name: stg_carriers
    columns:
      - name: carrier_id
        tests: [not_null, unique]
  - name: stg_purchase_order_lines
    columns:
      - name: po_id
        tests: [not_null]
      - name: po_line_number
        tests: [not_null]
  - name: stg_inventory_snapshots
  - name: stg_inventory_movements
    columns:
      - name: movement_id
        tests: [not_null, unique]
  - name: stg_sales_order_lines
  - name: stg_shipments
    columns:
      - name: shipment_id
        tests: [not_null, unique]
  - name: stg_status
    description: Reference status codes by domain
